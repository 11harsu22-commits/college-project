<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Order - E-Waste Platform</title>
    <link rel="stylesheet" href="review.css">
</head>
<body>

    <div class="container">
        <h2>Review Your Request</h2>
        <p>Please check your details before final confirmation.</p>

        <div class="review-box" id="reviewDetails">
            <p>Loading your details...</p>
        </div>

        <button id="confirmBtn" type="button">Confirm & Submit Order</button>
    </div>

    <script>
        
        const paymentMethod = sessionStorage.getItem("paymentMethod") || "Not Selected";

        const reviewBox = document.getElementById("reviewDetails");
        reviewBox.innerHTML = `
            <p><strong>Payment Preference:</strong> ${paymentMethod}</p>
            <p>Your e-waste collection and item details are ready to be finalized.</p>
        `;

        document.getElementById("confirmBtn").addEventListener("click", async function() {
            const token = localStorage.getItem("token");
            
            if (!token) {
                alert("Session expired. Please login again.");
                window.location.href = "login.html";
                return;
            }

            try {
                
                alert("Order confirmed successfully! Thank you for recycling with us.");
                
                
                sessionStorage.removeItem("paymentMethod");
                
            
                window.location.href = "success.html";
            } catch (error) {
                console.error("Error:", error);
                alert("Something went wrong during confirmation.");
            }
        });
    </script>

</body>
</html>
