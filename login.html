<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <form id="loginForm" action="#" class="box">

    <div><h1>LOGIN</h1></div>
    <div class="inputbox">
     <input type="email" id="email" class="box1" placeholder="Enter email">
     </div>
     <div class="inputbox">
     <input type="password" id="password" class="box1" placeholder="Enter password">
     </div>
    <div class="signin">
        <input type="submit" class="box3" value="Sign In">
    </div>
    <div class="footerbox">
    <div class="forgotbox">
        <a href="#">Forgot password</a>
    </div>
    <div class="signupbox">
          <a href="register.html">Sign Up</a>
    </div>
    </div>


    </form>
    <script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("http://localhost:5000/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

       const data = await response.json();

if (response.ok) {
    localStorage.setItem("token", data.token);
    window.location.href = "index.html";
} else {
    alert(data.message);
}
    } catch (error) {
        console.error("LOGIN ERROR:", error);
        alert("Server se connect nahi ho pa raha!");
    }
});
</script>
</body>
</html>
