<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
    <title>register</title>
</head>
<body>
    <form id="registerForm">
       <div class="box1">
        <h1 id="no1">ReCircuit</h1><h1>EcoHub</h1>
       </div>
       <!--INPUT BOXES-->
       <div class="box2">
        <!--ACCOUNT DETAILS BOX-->
        <div class="account">
            <h1>1. Account details</h1>
            <div class="h2">
              <div class="name imp-1">
                <label for="text">NAME:</label><br>
                <input type="text" id="text" name="name" required>
              </div> 
              <div class="email imp-1">
                <label for="email">EMAIL:</label><br>
                <input type="email" id="email" name="email" required>
              </div>
              <div class="pass imp-1">
                <label for="password">PASSWORD:</label><br>
                <input type="password" name="password" id="password" required>
                </div>
              <div class="conpass imp-1">
                <label for="cpassword">CONFORM PASSWORD:</label><br>
                <input type="password" id="cpassword" name="cpassword" required>
             </div>
             </div>
        </div>
        <!-- CONTACT INFORMATION-->
        <div class="contact">
            <h1>2. Contact Information</h1>
            <div class="h2">
            <div class="number imp-2">
                <label for="phone">PHONE NUMBER:</label><br>
                <input type="tel" id="phone" name="phone">
            </div>
            <div class="address">
                <label for="address"> COMPLETE ADDRESS:</label><br>
                <input type="text" id="address" name="address">
            </div>
            <div class="both">
                <div class="city">
                    <label for="city">CITY:</label><br>
                    <input type="text" id="city" name="city">
                </div>
                <div class="pin">
                    <label for="pincode">PIN CODE:</label><br>
                    <input type="number" id="pincode" name="pincode">
                </div>
            </div>
        </div>
        </div>
       </div>
       <div class="box3">
        <div class="terms">
            
            <label for="click">Mandatory</label>
            <input type="checkbox" name="Mandatory" id="click"> 
            I agree to the
            <a href="#">Terms & condition</a>
            and
            <a href="#">Privacy policy</a>
            
        </div>
       </div>
        <div class=" box4">
            <input type="submit" value="SUBMIT ">
       </div>
    </form>
 <script>
document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault(); 

    const formData = new FormData(e.target);
    
    
    const username = formData.get('name')?.trim();
    const email = formData.get('email')?.trim();
    const password = formData.get('password');
    const cpassword = formData.get('cpassword');

    
    if (password !== cpassword) {
        alert('Passwords do not match');
        return;
    }

    try {
        const response = await fetch('http://localhost:5000/api/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();

        if (response.ok) {
            alert('Registration Successful! Redirecting to Login...');
            window.location.href = 'login.html'; 
        } else {
            alert(data.message || 'Registration failed');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('An error occurred during registration. Please try again later.');
    }
});
</script>
</body>
</html>
